# AmogOS Installer uses Flutter 3.47.6.
name: amogos_installer
description: A playful home for your next AmogOS installation.
publish_to: none
version: 0.1.6+7
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  youtube_explode_dart: 3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
